[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflow"
version = "0.1.1"
description = "Self-hosted CI/CD platform with YAML pipelines and local executors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "arynull" }]
keywords = ["ci", "cd", "pipelines", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
forge = "forge:main"

[tool.setuptools]
py-modules = ["forge"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
